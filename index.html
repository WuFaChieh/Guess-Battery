<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔋</text></svg>" />

    <!-- PWA: lets the web version be "added to home screen" as its own app
         icon on both Android (via manifest.json) and iOS (Safari ignores the
         manifest for this and needs its own apple-touch-icon + meta tags
         instead) — the closest thing to a native app feel for anyone who
         hasn't installed the real iOS app from the App Store. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="猜電量" />
    <!-- viewport-fit=cover lets the page draw edge-to-edge under the iOS
         notch/Dynamic Island and home indicator (needed for the native app
         shell, see capacitor.config.ts) — the fixed Navbar/BottomNav pad
         themselves with env(safe-area-inset-*) to compensate (see those
         components). Harmless on the web: browsers without a safe-area
         concept just resolve those env() values to 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="author" content="冷月仙" />
    <title>猜電量 Guess the Battery | 作者：冷月仙 | 萬物皆有電量，你猜得準嗎？</title>
    <meta name="description" content="萬物皆有電量，你猜得準嗎？一款硬核數學／物理／經濟／財務猜謎遊戲：憑直覺把答案滑到 0～100% 電量，越接近真實答案分數越高。單人速刷、每日挑戰、同螢幕派對、1v1 即時 PK，一套規則通吃全部模式。" />
    <link rel="canonical" href="https://guess-battery.vercel.app/" />
    <!-- Open Graph / Twitter Card: without these, a link posted to Threads (or
         any other social feed) unfurls as a bare blue link with no title/image
         — the single biggest lever for click-through on a share-first platform.
         og-image.png is a static 1200x630 PNG generated by
         scripts/og-image/generate.html (see that file's header comment) — it's
         not built from the live app, so re-run that script by hand if the
         brand/copy on the card ever changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="猜電量 Guess the Battery" />
    <meta property="og:url" content="https://guess-battery.vercel.app/" />
    <meta property="og:title" content="猜電量 Guess the Battery — 萬物皆有電量，你猜得準嗎？" />
    <meta property="og:description" content="硬核數學／物理／經濟／財務猜謎遊戲：憑直覺把答案滑到 0～100% 電量，越接近真實答案分數越高。單人速刷、每日挑戰、同螢幕派對、1v1 即時 PK。" />
    <meta property="og:image" content="https://guess-battery.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="猜電量 Guess the Battery — 萬物皆有電量，你猜得準嗎？" />
    <meta name="twitter:description" content="硬核數學／物理／經濟／財務猜謎遊戲：憑直覺把答案滑到 0～100% 電量，越接近真實答案分數越高。" />
    <meta name="twitter:image" content="https://guess-battery.vercel.app/og-image.png" />
    <!-- Manrope covers Latin text and numerals only — it has no CJK glyphs, so
         Traditional Chinese text falls through to the system sans fallback in
         tailwind.config.js automatically, per-character. That's deliberate:
         it's what gives headings/percentages a designed feel without paying
         for (or shipping) a multi-MB CJK web font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Hide horizontal scrollbars globally */
      * {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-slate-950">
