<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔋</text></svg>" />

    <!-- PWA: lets the web version be "added to home screen" as its own app
         icon on both Android (via manifest.json) and iOS (Safari ignores the
         manifest for this and needs its own apple-touch-icon + meta tags
         instead) — the closest thing to a native app feel for anyone who
         hasn't installed the real iOS app from the App Store. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="猜電量" />
    <!-- viewport-fit=cover lets the page draw edge-to-edge under the iOS
         notch/Dynamic Island and home indicator (needed for the native app
         shell, see capacitor.config.ts) — the fixed Navbar/BottomNav pad
         themselves with env(safe-area-inset-*) to compensate (see those
         components). Harmless on the web: browsers without a safe-area
         concept just resolve those env() values to 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="author" content="冷月仙" />
    <title>猜電量 Guess the Battery | 作者：冷月仙 | 萬物皆有電量，你猜得準嗎？</title>
    <!-- Manrope covers Latin text and numerals only — it has no CJK glyphs, so
         Traditional Chinese text falls through to the system sans fallback in
         tailwind.config.js automatically, per-character. That's deliberate:
         it's what gives headings/percentages a designed feel without paying
         for (or shipping) a multi-MB CJK web font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Hide horizontal scrollbars globally */
      * {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
