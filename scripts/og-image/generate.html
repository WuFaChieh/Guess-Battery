<!doctype html>
<!--
  One-off generator for public/og-image.png — the static Open Graph/Twitter
  Card preview image referenced by index.html's `og:image`/`twitter:image`
  tags. Deliberately NOT part of the build: og:image needs to be a stable
  static file a social crawler can fetch without running JS, so this is
  rendered once by hand and the resulting PNG is committed to public/.

  This is hand-written vanilla JS (not TypeScript, no bundler) rather than
  reusing src/utils/shareCard.ts's renderer directly, since that module is
  built for the live React app's runtime (imports app translations/fonts) —
  duplicating just the drawing logic here keeps this a plain static file you
  can open directly in a browser with zero build step. If the brand/copy on
  the in-app share cards changes, eyeball this file's layout against
  shareCard.ts's `drawShareCard` and update both by hand; they're not meant
  to diverge in *style*, just in code path.

  How to regenerate:
    1. Open this file directly in a browser (double-click it, or any
       file:// / localhost server).
    2. Open devtools console and run:
         document.getElementById('og').toBlob(b => {
           const a = document.createElement('a');
           a.href = URL.createObjectURL(b);
           a.download = 'og-image.png';
           a.click();
         }, 'image/png')
       (or just right-click the canvas -> "Save image as…" — same result.)
    3. Save the download as public/og-image.png, replacing the old one.
-->
<html>
<head>
<meta charset="utf-8">
<title>og-image generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="og" width="1200" height="630"></canvas>
<script>
function roundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawGlow(ctx, cx, cy, radius, rgb, alpha) {
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
  grad.addColorStop(0, `rgba(${rgb},${alpha})`);
  grad.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
}

function draw() {
  const W = 1200, H = 630;
  const canvas = document.getElementById('og');
  const ctx = canvas.getContext('2d');
  const cx = W / 2;

  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#020617');
  bg.addColorStop(1, '#0f172a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawGlow(ctx, W * 0.85, H * 0.1, 420, '16,185,129', 0.22);
  drawGlow(ctx, W * 0.1, H * 0.95, 380, '139,92,246', 0.2);

  roundedRect(ctx, 24, 24, W - 48, H - 48, 32);
  ctx.strokeStyle = 'rgba(148,163,184,0.18)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // App name pill
  const pillText = '🔋 猜電量 · GUESS THE BATTERY';
  ctx.font = '700 26px "Manrope", "Noto Sans TC", system-ui, sans-serif';
  const pillW = ctx.measureText(pillText).width + 64;
  const pillH = 54;
  const pillY = 110;
  roundedRect(ctx, cx - pillW / 2, pillY - pillH / 2, pillW, pillH, pillH / 2);
  ctx.fillStyle = 'rgba(16,185,129,0.12)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(52,211,153,0.35)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#34d399';
  ctx.fillText(pillText, cx, pillY + 2);

  // Main tagline (zh)
  ctx.font = '900 62px "Manrope", "Noto Sans TC", system-ui, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(16,185,129,0.4)';
  ctx.shadowBlur = 30;
  ctx.fillText('萬物皆有電量，你猜得準嗎？', cx, 235);
  ctx.shadowBlur = 0;

  // Sub tagline (en)
  ctx.font = '600 30px "Manrope", system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('Everything has a battery level. Can you guess it?', cx, 290);

  // Mode chips row
  const modes = ['🔋 經典速刷', '📅 每日挑戰', '👥 同屏派對', '⚔️ 1v1 PK', '✏️ 自訂題庫'];
  ctx.font = '700 24px "Manrope", "Noto Sans TC", system-ui, sans-serif';
  const gap = 16;
  const chipWidths = modes.map((m) => ctx.measureText(m).width + 44);
  const totalW = chipWidths.reduce((a, b) => a + b, 0) + gap * (modes.length - 1);
  let chipX = cx - totalW / 2;
  const chipY = 400;
  modes.forEach((m, i) => {
    const w = chipWidths[i];
    roundedRect(ctx, chipX, chipY - 28, w, 56, 28);
    ctx.fillStyle = 'rgba(148,163,184,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(148,163,184,0.25)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText(m, chipX + w / 2, chipY + 2);
    chipX += w + gap;
  });

  // Footer divider + domain
  ctx.strokeStyle = 'rgba(148,163,184,0.15)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W * 0.3, 480);
  ctx.lineTo(W * 0.7, 480);
  ctx.stroke();

  ctx.font = '600 24px "Manrope", "Noto Sans TC", system-ui, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('140 題硬核微積分／幾何／代數／力學／經濟／財務猜謎', cx, 525);
  ctx.font = '800 30px "Manrope", system-ui, sans-serif';
  ctx.fillStyle = '#34d399';
  ctx.fillText('guess-battery.vercel.app', cx, 570);
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(draw).catch(draw);
} else {
  draw();
}
</script>
</body>
</html>
